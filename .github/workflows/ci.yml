name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same floating tag as deploy/dev/test-db.sh; pg_trgm ships with the official image.
        image: postgres:latest
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: csdash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d csdash_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/csdash_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go build ./cmd/dashboard
      # internal/api runs once, in the race step below.
      - run: |
          mapfile -t packages_without_api < <(go list ./... | grep -v '/internal/api$')
          go test -count=1 -p 2 "${packages_without_api[@]}"
      - run: go test -count=1 -p 2 -race ./internal/api

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: deploy/Dockerfile
          config: .hadolint.yaml
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: deploy/Dockerfile.sidecar
          config: .hadolint.yaml
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: github.event_name != 'pull_request'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: false
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

  docs-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse local home paths in tracked files
        run: |
          if git grep -nIE '/home/[A-Za-z]' -- ':!:CHANGELOG*' ':!:**/CHANGELOG*'; then
            echo "Tracked files contain a local home path; use a neutral value such as ~ or <repo>." >&2
            exit 1
          fi
      - name: Refuse tracked working notes
        run: |
          tracked_notes="$(git ls-files -- docs/superpowers .superpowers)"
          if [ -n "${tracked_notes}" ]; then
            printf '%s\n' "${tracked_notes}"
            echo "docs/superpowers and .superpowers must never be tracked." >&2
            exit 1
          fi
