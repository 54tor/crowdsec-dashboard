name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse a tag that differs from web/package.json
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          package_version="$(jq -r .version web/package.json)"
          if [ "${TAG_NAME}" != "v${package_version}" ]; then
            echo "Tag ${TAG_NAME} does not match web/package.json version ${package_version} (expected v${package_version})." >&2
            exit 1
          fi

  gates:
    needs: verify-version
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        # Add one entry per image. "dashboard" is published as ghcr.io/<repository>,
        # any other name as ghcr.io/<repository>/<name>.
        images:
          - name: dashboard
            dockerfile: deploy/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the image reference
        id: image
        env:
          IMAGE_NAME: ${{ matrix.images.name }}
        run: |
          repository_image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "${IMAGE_NAME}" = "dashboard" ]; then
            echo "reference=${repository_image}" >> "${GITHUB_OUTPUT}"
          else
            echo "reference=${repository_image}/${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          fi
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ${{ steps.image.outputs.reference }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: ${{ matrix.images.context }}
          file: ${{ matrix.images.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.images.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.images.name }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.reference }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          prerelease_flag=()
          if [ "${IS_PRERELEASE}" = "true" ]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --title "${TAG_NAME}" --generate-notes "${prerelease_flag[@]}"
