name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse a tag that differs from web/package.json
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          package_version="$(jq -r .version web/package.json)"
          if [ "${TAG_NAME}" != "v${package_version}" ]; then
            echo "Tag ${TAG_NAME} does not match web/package.json version ${package_version} (expected v${package_version})." >&2
            exit 1
          fi

  gates:
    needs: verify-version
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # Phase 1: every image is built and pushed under the commit tag sha-<commit> only. No public tag
  # moves, so a failed build leaves the previous release untouched.
  publish:
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        # Add one entry per image. "dashboard" is published as ghcr.io/<repository>,
        # any other name as ghcr.io/<repository>/<name>.
        images:
          - name: dashboard
            dockerfile: deploy/Dockerfile
            context: .
          - name: sidecar
            dockerfile: deploy/Dockerfile.sidecar
            context: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the image reference
        id: image
        env:
          IMAGE_NAME: ${{ matrix.images.name }}
        run: |
          repository_image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "${IMAGE_NAME}" = "dashboard" ]; then
            echo "reference=${repository_image}" >> "${GITHUB_OUTPUT}"
          else
            echo "reference=${repository_image}/${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          fi
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ${{ steps.image.outputs.reference }}
          flavor: latest=false
          tags: |
            type=sha,format=long
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: ${{ matrix.images.context }}
          file: ${{ matrix.images.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.images.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.images.name }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.reference }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Phase 2: runs only once every image of phase 1 succeeded, and copies each sha-<commit>
  # manifest under the version tags without rebuilding, so the digests and attestations stay.
  promote:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve the image references
        id: images
        run: |
          repository_image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "dashboard=${repository_image}" >> "${GITHUB_OUTPUT}"
          echo "sidecar=${repository_image}/sidecar" >> "${GITHUB_OUTPUT}"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: dashboard-tags
        with:
          images: ${{ steps.images.outputs.dashboard }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: sidecar-tags
        with:
          images: ${{ steps.images.outputs.sidecar }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the commit images with the version tags
        env:
          DASHBOARD_IMAGE: ${{ steps.images.outputs.dashboard }}
          DASHBOARD_TAGS: ${{ steps.dashboard-tags.outputs.tags }}
          SIDECAR_IMAGE: ${{ steps.images.outputs.sidecar }}
          SIDECAR_TAGS: ${{ steps.sidecar-tags.outputs.tags }}
        run: |
          promote_image() {
            local image_reference="$1"
            local version_tags="$2"
            local tag_arguments=()
            while IFS= read -r version_tag; do
              if [ -n "${version_tag}" ]; then
                tag_arguments+=(--tag "${version_tag}")
              fi
            done <<< "${version_tags}"
            docker buildx imagetools create "${tag_arguments[@]}" "${image_reference}:sha-${GITHUB_SHA}"
          }
          promote_image "${DASHBOARD_IMAGE}" "${DASHBOARD_TAGS}"
          promote_image "${SIDECAR_IMAGE}" "${SIDECAR_TAGS}"

  github-release:
    needs: promote
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          prerelease_flag=()
          if [ "${IS_PRERELEASE}" = "true" ]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --title "${TAG_NAME}" --generate-notes "${prerelease_flag[@]}"
