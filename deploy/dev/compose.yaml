# Disposable development stack: a throwaway CrowdSec, the socket proxy and the dashboard.
# Use ./up.sh to start it (it generates .env.local, registers the dashboard machine and
# prints the one-time enrolment token of the first account). Tear down with:
#   docker compose -p csdash-dev --env-file .env.local -f compose.yaml -f peer/compose.override.yaml down -v --remove-orphans
# (throwaway project only, never for a stack whose data matters; the override file removes the peer-a volumes too)
# CSDASH_PROJECT (default csdash-dev) prefixes every container and image name and
# CSDASH_DASHBOARD_PORT (default 18080) is the host port, so a second isolated copy can run
# beside the default one (see up.sh). Without them the stack is exactly csdash-dev on 18080.
name: ${CSDASH_PROJECT:-csdash-dev}

services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: ${CSDASH_PROJECT:-csdash-dev}-crowdsec
    restart: "no"
    mem_limit: 768m
    pids_limit: 256
    cpus: 1.0
    environment:
      COLLECTIONS: crowdsecurity/linux
      DISABLE_ONLINE_API: "true"
    volumes:
      - ./acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      # The image enables Prometheus by default; the real instance has it off, so do we.
      # up.sh metrics switches this to config.prometheus-on.yaml.
      - ${CROWDSEC_LOCAL_CONFIG:-./config.prometheus-off.yaml}:/etc/crowdsec/config.yaml.local:ro
      - crowdsec-config:/etc/crowdsec
      - crowdsec-data:/var/lib/crowdsec/data
      - dev-logs:/var/log/dev
    networks: [core, egress]

  postgres:
    image: postgres:latest
    container_name: ${CSDASH_PROJECT:-csdash-dev}-postgres
    restart: "no"
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_DB: dashboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run up.sh first}
    volumes:
      - postgres-data:/var/lib/postgresql
    mem_limit: 512m
    pids_limit: 128
    cpus: 0.5
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d dashboard"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [core]

  socket-proxy:
    image: wollomatic/socket-proxy:1
    container_name: ${CSDASH_PROJECT:-csdash-dev}-socket-proxy
    restart: "no"
    user: "65534:${DOCKER_GID:?run up.sh first}"
    mem_limit: 64m
    pids_limit: 64
    cpus: 0.25
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    command:
      - -loglevel=debug
      - -listenip=0.0.0.0
      - -allowfrom=${CSDASH_PROJECT:-csdash-dev}-dashboard
      - -allowGET=(/v[0-9.]+)?/exec/[0-9a-f]{64}/json
      - -allowPOST=(/v[0-9.]+)?/(containers/${CSDASH_PROJECT:-csdash-dev}-crowdsec/exec|exec/[0-9a-f]{64}/start)
      - -shutdowngracetime=5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [core]

  dashboard:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    image: ${CSDASH_PROJECT:-csdash-dev}-dashboard:local
    container_name: ${CSDASH_PROJECT:-csdash-dev}-dashboard
    restart: "no"
    mem_limit: 256m
    pids_limit: 128
    cpus: 0.5
    read_only: true
    tmpfs:
      - /run:exec,nosuid,nodev,mode=0755
      - /tmp:noexec,nosuid,nodev,mode=1777
      - /etc/cron.d:noexec,nosuid,nodev,mode=0755
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, KILL, SETGID, SETUID]
    secrets:
      - dashboard-secrets-key
      # Optional GeoLite2 updates: uncomment with the matching top-level secrets below.
      # - maxmind-account-id
      # - maxmind-license-key
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    env_file: ${CSDASH_ENV_FILE:-.env.local}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LISTEN_ADDR: ":8080"
      LAPI_URL: http://${CSDASH_PROJECT:-csdash-dev}-crowdsec:8080
      LAPI_MACHINE_ID: dashboard-dev
      CROWDSEC_CONTAINER: ${CSDASH_PROJECT:-csdash-dev}-crowdsec
      DOCKER_HOST: tcp://socket-proxy:2375
      CROWDSEC_CONF_DIR: /etc/crowdsec
      TRUSTED_PROXY_CIDRS: ""
      SECRETS_KEY_FILE: /run/dashboard-secrets/key
      S6_READ_ONLY_ROOT: "1"
      WAIT_FOR_NETWORK: "false"
      GEOIP_DATABASE_FILE: /var/lib/geoip/GeoLite2-Country.mmdb
      GEOIPUPDATE_FREQUENCY_HOURS: "24"
    volumes:
      - crowdsec-config:/etc/crowdsec:ro
      - geoip-data:/var/lib/geoip
    ports:
      - "127.0.0.1:${CSDASH_DASHBOARD_PORT:-18080}:8080"
    networks: [core, egress]

  # Not started by default. Shares the dashboard network namespace (same source IP) so
  # check-proxy.sh can prove what the socket proxy lets the dashboard do.
  probe:
    profiles: [probe]
    image: curlimages/curl:latest
    container_name: ${CSDASH_PROJECT:-csdash-dev}-probe
    network_mode: "container:${CSDASH_PROJECT:-csdash-dev}-dashboard"
    mem_limit: 32m
    pids_limit: 32
    cpus: 0.25
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    entrypoint: ["sleep", "infinity"]

volumes:
  crowdsec-config:
  crowdsec-data:
  postgres-data:
  geoip-data:
  dev-logs:

secrets:
  dashboard-secrets-key:
    file: ${CSDASH_SECRETS_KEY_FILE:-./secrets/dashboard-secrets.key}
  # maxmind-account-id:
  #   file: ./secrets/maxmind-account-id
  # maxmind-license-key:
  #   file: ./secrets/maxmind-license-key

networks:
  core:
    internal: true
  egress: {}
