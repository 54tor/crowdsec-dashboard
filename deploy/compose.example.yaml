# Production example. Adapt names, networks and paths; keep the security settings.
#
# Secrets never live in this file: copy dashboard.env.example to dashboard.env (mode 0600)
# and postgres.env.example to postgres.env (mode 0600) and fill them in. The first account is
# created in the browser: read the one-time enrolment token in the dashboard logs at first start.
name: crowdsec-dashboard

services:
  # The CrowdSec you already run. Shown only so the example is self-contained: keep your own
  # service and only make sure that its container_name matches CROWDSEC_CONTAINER below and
  # that it shares the "crowdsec" network with the dashboard.
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    pids_limit: 256
    volumes:
      - crowdsec-config:/etc/crowdsec
      - crowdsec-data:/var/lib/crowdsec/data
      # Optional config import (CONFIG_IMPORT_ENABLED below): CrowdSec reads the dedicated
      # directory the dashboard writes to, read-only, as its acquis.d. Move your existing acquis.d
      # files into ./acquis.d first.
      # - ./acquis.d:/etc/crowdsec/acquis.d:ro
    networks: [crowdsec]

  # The only component that talks to the Docker socket. It exposes three calls and denies
  # everything else: create an exec on the CrowdSec container, start an exec, inspect an exec.
  # Replace 'crowdsec' in the POST rule if your container has another name.
  socket-proxy:
    image: wollomatic/socket-proxy:1
    container_name: crowdsec-dashboard-socket-proxy
    restart: unless-stopped
    # 65534 = nobody; DOCKER_GID is the group that owns /var/run/docker.sock (stat -c %g /var/run/docker.sock).
    user: "65534:${DOCKER_GID:?set DOCKER_GID to the gid of the docker socket}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    mem_limit: 64m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    command:
      - -listenip=0.0.0.0
      # Only the dashboard container may call the proxy.
      - -allowfrom=crowdsec-dashboard
      # Exec inspect: GET /exec/<64 hex>/json (optionally prefixed by /v1.NN).
      - -allowGET=(/v[0-9.]+)?/exec/[0-9a-f]{64}/json
      # Exec create on the CrowdSec container, and exec start.
      - -allowPOST=(/v[0-9.]+)?/(containers/crowdsec/exec|exec/[0-9a-f]{64}/start)
      - -shutdowngracetime=5
    volumes:
      # Read-only mount of the socket; the filtering above is what restricts the API.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-proxy]

  postgres:
    # A pull that crosses a PostgreSQL major version starts an empty cluster: see docs/operations.md.
    image: postgres:latest
    container_name: crowdsec-dashboard-postgres
    restart: unless-stopped
    env_file: postgres.env
    volumes:
      - postgres-data:/var/lib/postgresql
    # The entrypoint needs these to fix ownership and drop to the postgres user.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges]
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    # No published port: only the dashboard reaches it, on its own internal network.
    networks: [database]

  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: crowdsec-dashboard:latest
    container_name: crowdsec-dashboard
    restart: unless-stopped
    # DATABASE_URL, LAPI_MACHINE_PASSWORD: see dashboard.env.example.
    env_file: dashboard.env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LISTEN_ADDR: ":8080"
      SESSION_TTL: 12h
      LAPI_URL: http://crowdsec:8080
      LAPI_MACHINE_ID: dashboard
      CROWDSEC_CONTAINER: crowdsec
      # The dashboard never sees the Docker socket, only the filtering proxy.
      DOCKER_HOST: tcp://socket-proxy:2375
      CROWDSEC_CONF_DIR: /etc/crowdsec
      # X-Forwarded-For is believed only when the TCP peer is inside this list, and the client
      # address it carries drives the per-IP login rate limit. List ONLY the reverse proxy,
      # as a single address: trusting the whole subnet would let any other container on the
      # "web" network forge the header and dodge the limiter. The proxy already exists and
      # "web" is ITS network (declared external below), so use the address the proxy has on it:
      # docker inspect -f '{{ (index .NetworkSettings.Networks "reverse-proxy-net").IPAddress }}' <proxy>
      # Pin it in the proxy's own compose (ipv4_address) so that it survives recreation, and use
      # that /32 here. IPv6 variant: TRUSTED_PROXY_CIDRS: fd00:30::10/128
      TRUSTED_PROXY_CIDRS: 172.30.0.10/32
      SECRETS_KEY_FILE: /run/dashboard-secrets/key
      # Key rotation: the init script copies each compose secret listed in SECRETS_RETIRED_KEY_SOURCES
      # to /run/dashboard-secrets/retired-N (in order); SECRETS_RETIRED_KEY_FILES lists those copies.
      # SECRETS_RETIRED_KEY_SOURCES: /run/secrets/dashboard-secrets-key-retired
      # SECRETS_RETIRED_KEY_FILES: /run/dashboard-secrets/retired-1
      S6_READ_ONLY_ROOT: "1"
      WAIT_FOR_NETWORK: "false"
      GEOIP_DATABASE_FILE: /var/lib/geoip/GeoLite2-Country.mmdb
      GEOIPUPDATE_FREQUENCY_HOURS: "24"
      # Optional import of acquis.d files from a bundle (docs/bundles.md), off by default. These
      # lines override dashboard.env. Enable only for a migration, with the dedicated mount below.
      # CONFIG_IMPORT_ENABLED: "true"
      # CONFIG_IMPORT_DIR: /var/lib/dashboard-acquis.d
    volumes:
      # Read-only: never mount /etc/crowdsec (or the CrowdSec config volume) writable here.
      - crowdsec-config:/etc/crowdsec:ro
      - geoip-data:/var/lib/geoip
      # Optional config import: the ONLY writable CrowdSec path, the same host directory that the
      # crowdsec service mounts read-only at /etc/crowdsec/acquis.d. Create it owned by the dashboard
      # user (uid/gid 10000, DOCKER_USER_UID/DOCKER_USER_GID) so it can write, and CrowdSec (root)
      # can read the files it creates (mode 0640):
      #   install -d -o 10000 -g 10000 -m 0750 acquis.d
      # - ./acquis.d:/var/lib/dashboard-acquis.d
      # Once the acquisition files live in ./acquis.d they are no longer in the crowdsec-config
      # volume: mount the same directory read-only here too, or the Config page and the config
      # export stop listing them.
      # - ./acquis.d:/etc/crowdsec/acquis.d:ro
    read_only: true
    # /run must be exec and not world-writable for s6-overlay.
    tmpfs:
      - /run:exec,nosuid,nodev,mode=0755
      - /tmp:noexec,nosuid,nodev,mode=1777
      - /etc/cron.d:noexec,nosuid,nodev,mode=0755
    # SETUID/SETGID for s6-setuidgid, KILL to signal the dashboard on stop, DAC_READ_SEARCH and CHOWN to hand the secrets and the GeoLite2 volume to it.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, KILL, SETGID, SETUID]
    secrets:
      - dashboard-secrets-key
      # During a key rotation: uncomment with the matching top-level secret below.
      # - dashboard-secrets-key-retired
      # Optional GeoLite2 updates: uncomment with the matching top-level secrets below.
      # - maxmind-account-id
      # - maxmind-license-key
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    # One argon2id verification allocates 64 MiB and logins are serialized: 256m leaves headroom.
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # No published port: the TLS reverse proxy shares the "web" network and forwards to dashboard:8080.
    expose: ["8080"]
    networks: [crowdsec, docker-proxy, database, web]

  # Example of the TLS reverse proxy you already run, with the fixed address trusted above.
  # reverse-proxy:
  #   image: traefik:latest
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: 10m
  #       max-file: "3"
  #   networks:
  #     web:
  #       ipv4_address: 172.30.0.10

volumes:
  crowdsec-config:
  crowdsec-data:
  postgres-data:
  geoip-data:

# Create once, outside git: install -d -m 0700 secrets && (umask 077; openssl rand -base64 32 > secrets/dashboard-secrets.key)
secrets:
  dashboard-secrets-key:
    file: ./secrets/dashboard-secrets.key
  # dashboard-secrets-key-retired:
  #   file: ./secrets/dashboard-secrets-retired.key
  # maxmind-account-id:
  #   file: ./secrets/maxmind-account-id
  # maxmind-license-key:
  #   file: ./secrets/maxmind-license-key

networks:
  crowdsec: {}
  database:
    internal: true
  docker-proxy:
    internal: true
  # The existing network of your reverse proxy, created by the proxy's own compose project.
  # Rename it to match (docker network ls) and keep "external: true".
  web:
    external: true
    name: reverse-proxy-net
